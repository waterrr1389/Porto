<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SLA</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="stage">
  <div id="view" class="bar-shown">
    <!-- playsinline keeps iPhone from taking the video fullscreen without the overlays. -->
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <div id="tap"></div>
    <div id="zh" class="subs"></div>
    <div id="ja" class="subs"></div>
    <div id="shade" class="chrome"></div>
    <div id="top-bar" class="chrome">
      <button id="library" aria-label="列表"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="label">列表</span></button>
      <span id="title"></span>
      <button id="next" aria-label="下一集" hidden><span class="label">下一集</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button id="subtitles-button" aria-label="字幕"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5.5" width="17" height="13" rx="3.5"/><path d="M7.5 11h4M7.5 15h7"/></svg></button>
      <button id="volume-button" aria-label="音量"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="wave1" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="wave2" d="M18 7a7 7 0 0 1 0 10"/></svg></button>
      <button id="fullscreen" aria-label="全屏"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <button id="play" class="chrome" aria-label="播放"></button>
    <div id="cue-nav" class="chrome" hidden>
      <button id="cue-prev" class="step"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>上一句</button>
      <button id="cue-toggle" aria-label="字幕跳转"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg></button>
      <button id="cue-next" class="step">下一句<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div id="volume" class="chrome" hidden><div id="volume-steps"></div></div>
    <div id="subtitles" class="chrome" hidden><div id="subtitle-menu"></div></div>
    <div id="swipe-preview"></div>
    <div id="speed"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M3 6l9 6-9 6zM12 6l9 6-9 6z"/></svg>2×</div>
    <div id="bar" class="chrome">
      <div id="track"><div class="rail"><div id="buffered"></div><div id="played"></div></div><div id="scrub-tip"></div></div>
      <div id="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
    </div>
  </div>
  <div id="library-screen" hidden></div>
  <div id="panel">
    <div id="panel-head">
      <button id="back" disabled>‹</button>
      <span class="query"></span>
      <button id="close">✕</button>
    </div>
    <div id="results"></div>
  </div>
  <div id="notice"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
